spring.application.name=uplift-backend

# Local development and tests use an in-memory database. Activate the mysql
# profile and provide DB_URL, DB_USERNAME, and DB_PASSWORD for persistent storage.
spring.datasource.url=jdbc:h2:mem:upliftdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# Set JWT_SECRET to a unique high-entropy value outside local development.
app.jwt.secret=${JWT_SECRET:local-only-change-this-secret-before-deploy-0123456789}
app.jwt.expiration=86400000
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
